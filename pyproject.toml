[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frankenstein-character-runtime"
version = "0.1.0"
description = "Local-first, renderer-neutral persistent character runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jeremiah Ratican"}]
dependencies = []

[project.scripts]
frankenstein = "frankenstein.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
