[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frankenstein-character-runtime"
version = "0.2.0rc1"
description = "Qualified Frankenstein v0.2 release candidate and Bride donor qualification laboratory"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jeremiah Ratican"}]
dependencies = []

[project.scripts]
frankenstein = "frankenstein.cli:main"
bride-qualify = "bride.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
