[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frankenstein-character-runtime"
version = "0.2.0rc1"
description = "Renderer-neutral persistent character runtime with causally qualified v0.2 continuity mechanisms"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jeremiah Ratican"}]
dependencies = []

[project.scripts]
frankenstein = "frankenstein.cli:main"
bride-qualify = "bride.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
