name: donor-qualification

on:
  push:
    branches:
      - lab/v0.2-donor-qualification
      - candidate/v0.2-qualified-integrations
  pull_request:

concurrency:
  group: donor-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: python -m frankenstein eval
      - run: bride-qualify list
      - run: bride-qualify suite --real-frankenstein --output evidence/qualification-results.json
      - run: bride-qualify longitudinal --output evidence/longitudinal-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: bride-qualification-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            evidence/qualification-results.json
            evidence/longitudinal-results.json
          if-no-files-found: error
